<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070914"><title>تغيير كلمة مرور المدير</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070914;color:#f8fafc;font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center;padding:20px}.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 15% 15%,#ef23452b,transparent 34%),radial-gradient(ellipse at 85% 75%,#2563eb38,transparent 35%),#070914}.panel{width:min(480px,100%);background:#0d1429ef;border:1px solid #ffffff20;border-radius:20px;padding:25px;box-shadow:0 0 35px #2563eb20}h1{text-align:center;font-size:25px}p{color:#9aa9c3;font-size:13px;line-height:1.9}label{display:block;color:#b9c7dc;font-size:12px;margin:14px 0 7px}input{width:100%;padding:13px;border-radius:10px;border:1px solid #344563;background:#070d1d;color:white;font:inherit}button{width:100%;margin-top:17px;border:0;border-radius:10px;padding:13px;font:inherit;font-weight:bold;color:white;cursor:pointer;background:linear-gradient(100deg,#e11d48,#2563eb)}.notice{margin-top:13px;padding:12px;border-radius:10px;background:#14233c;color:#b9d8ff;font-size:12px;line-height:1.8;white-space:pre-wrap}.error{background:#351722;color:#fecdd3}.ok{background:#123326;color:#bbf7d0}a{color:#7dd3fc}
</style></head><body><div class="bg"></div><main class="panel"><h1>تغيير كلمة مرور المدير</h1><p>اكتب كلمة المرور الجديدة مرتين. يجب أن تكون 8 أحرف على الأقل. افتح الصفحة من رابط الاستعادة الذي وصلك على بريد المدير.</p><label for="newPassword">كلمة المرور الجديدة</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="8 أحرف على الأقل"><label for="confirmPassword">تأكيد كلمة المرور</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="أعد كتابة كلمة المرور"><button id="saveBtn">حفظ كلمة المرور الجديدة</button><div id="msg" class="notice" hidden></div><p><a href="admin.html">العودة إلى لوحة الإدارة</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const $=id=>document.getElementById(id);function show(t,k=""){const e=$("msg");e.textContent=t;e.className="notice "+k;e.hidden=false}const configured=()=>window.AMJAD_SUPABASE_URL&&window.AMJAD_SUPABASE_ANON_KEY;let sb=null,recoveryReady=false;
async function start(){if(!configured()){show("إعداد Supabase غير مكتمل. راجع supabase-config.js.","error");return}sb=window.supabase.createClient(window.AMJAD_SUPABASE_URL,window.AMJAD_SUPABASE_ANON_KEY);sb.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"&&session)recoveryReady=true});const {data,error}=await sb.auth.getSession();if(error){show("تعذر التحقق من رابط الاستعادة: "+error.message,"error");return}if(data.session){recoveryReady=true;return}setTimeout(async()=>{const r=await sb.auth.getSession();if(r.data.session)recoveryReady=true;else show("رابط الاستعادة غير صالح أو انتهت صلاحيته. ارجع إلى admin.html واطلب رابطاً جديداً.","error")},1200)}
$("saveBtn").onclick=async()=>{if(!sb){show("انتظر تحميل الاتصال أو حدّث الصفحة.","error");return}const a=$("newPassword").value,b=$("confirmPassword").value;if(a.length<8){show("اجعل كلمة المرور 8 أحرف على الأقل.","error");return}if(a!==b){show("كلمتا المرور غير متطابقتين.","error");return}const {data}=await sb.auth.getSession();if(!data.session&&!recoveryReady){show("افتح رابط الاستعادة الذي وصلك بالبريد أولاً.","error");return}const {error}=await sb.auth.updateUser({password:a});if(error){show("تعذر تغيير كلمة المرور: "+error.message,"error");return}show("تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول من لوحة الإدارة.","ok");$("newPassword").value="";$("confirmPassword").value="";setTimeout(()=>location.href="admin.html",1800)};start();
</script></body></html>
