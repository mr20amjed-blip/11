<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070914"><title>تغيير كلمة مرور المدير | AMJAD PROGRAMS</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070914;color:#f8fafc;font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center;padding:20px}.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 15% 15%,#ef23452b,transparent 34%),radial-gradient(ellipse at 85% 75%,#2563eb38,transparent 35%),#070914}.panel{width:min(480px,100%);background:#0d1429ef;border:1px solid #ffffff20;border-radius:20px;padding:25px;box-shadow:0 0 35px #2563eb20}h1{text-align:center;font-size:25px;margin:0 0 12px}p{color:#9aa9c3;font-size:13px;line-height:1.9}label{display:block;color:#b9c7dc;font-size:12px;margin:14px 0 7px}input{width:100%;padding:13px;border-radius:10px;border:1px solid #344563;background:#070d1d;color:white;font:inherit}button{width:100%;margin-top:17px;border:0;border-radius:10px;padding:13px;font:inherit;font-weight:bold;color:white;cursor:pointer;background:linear-gradient(100deg,#e11d48,#2563eb)}button:disabled{opacity:.55;cursor:not-allowed}.notice{margin-top:13px;padding:12px;border-radius:10px;background:#14233c;color:#b9d8ff;font-size:12px;line-height:1.8;white-space:pre-wrap}.error{background:#351722;color:#fecdd3}.ok{background:#123326;color:#bbf7d0}a{color:#7dd3fc}
</style></head>
<body><div class="bg"></div><main class="panel">
<h1>تغيير كلمة مرور المدير</h1>
<p>افتح هذه الصفحة من أحدث رسالة استعادة وصلت إلى بريد المدير، ثم أدخل كلمة مرور جديدة مرتين.</p>
<div id="status" class="notice">جاري التحقق من رابط الاستعادة...</div>
<div id="form" hidden>
<label for="newPassword">كلمة المرور الجديدة</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="8 أحرف على الأقل">
<label for="confirmPassword">تأكيد كلمة المرور</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="أعد كتابة كلمة المرور">
<button id="saveBtn">حفظ كلمة المرور الجديدة</button></div>
<p><a href="admin.html">العودة إلى لوحة الإدارة</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
(()=>{
 const $=id=>document.getElementById(id); let sb,ready=false;
 function status(t,type=''){const el=$('status');el.textContent=t;el.className='notice '+type;}
 async function init(){
  if(!window.AMJAD_SUPABASE_URL||!window.AMJAD_SUPABASE_ANON_KEY){status('إعداد الاتصال غير مكتمل. تحقق من ملف supabase-config.js.','error');return;}
  sb=window.supabase.createClient(window.AMJAD_SUPABASE_URL,window.AMJAD_SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
  // Supabase يقرأ رمز الاستعادة من عنوان الصفحة ويحوّله إلى جلسة.
  const url=new URL(location.href); const errorCode=url.searchParams.get('error_code'); const errorDesc=url.searchParams.get('error_description');
  if(errorCode){status('رابط الاستعادة غير صالح أو منتهي: '+(errorDesc||errorCode),'error');return;}
  const {data,error}=await sb.auth.getSession();
  if(error){status('تعذر التحقق من رابط الاستعادة: '+error.message,'error');return;}
  if(data.session){ready=true;$('form').hidden=false;status('تم التحقق من رابط الاستعادة. أدخل كلمة المرور الجديدة.','ok');return;}
  // ننتظر حدث PASSWORD_RECOVERY إذا وصل بعد تهيئة الصفحة.
  const timer=setTimeout(async()=>{const r=await sb.auth.getSession();if(r.data.session){ready=true;$('form').hidden=false;status('تم التحقق من رابط الاستعادة. أدخل كلمة المرور الجديدة.','ok');}else{status('لم نعثر على جلسة استعادة. افتح أحدث رسالة استعادة من بريدك، ولا تستخدم رابطاً قديماً.','error');}},1800);
  sb.auth.onAuthStateChange(async(event,session)=>{if(event==='PASSWORD_RECOVERY'&&session){clearTimeout(timer);ready=true;$('form').hidden=false;status('تم التحقق من رابط الاستعادة. أدخل كلمة المرور الجديدة.','ok');}});
 }
 $('saveBtn').addEventListener('click',async()=>{
  if(!sb||!ready){status('رابط الاستعادة غير مفعّل. ارجع إلى البريد وافتح أحدث رابط استعادة.','error');return;}
  const a=$('newPassword').value,b=$('confirmPassword').value;
  if(a.length<8){status('كلمة المرور يجب أن تكون 8 أحرف على الأقل.','error');return;}
  if(a!==b){status('كلمتا المرور غير متطابقتين.','error');return;}
  $('saveBtn').disabled=true;status('جاري حفظ كلمة المرور...');
  const {error}=await sb.auth.updateUser({password:a});
  $('saveBtn').disabled=false;
  if(error){status('تعذر تغيير كلمة المرور: '+error.message,'error');return;}
  status('تم تغيير كلمة المرور بنجاح. يمكنك الآن الدخول إلى لوحة الإدارة.','ok');
  $('newPassword').value='';$('confirmPassword').value='';
  await sb.auth.signOut();
  setTimeout(()=>location.href='admin.html',2200);
 });
 init().catch(e=>status('حدث خطأ: '+e.message,'error'));
})();
</script></body></html>
